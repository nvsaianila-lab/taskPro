{% extends 'base.html' %}

{% block content %}

<h1>Completed Tasks</h1>

<br>

<table>

    <tr>
        <th>Task</th>
        <th>Priority</th>
        <th>Deadline</th>
    </tr>

    {% for task in tasks %}

    <tr>

        <td>{{ task.title }}</td>

        <td>{{ task.priority }}</td>

        <td>{{ task.deadline }}</td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
