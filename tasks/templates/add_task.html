{% extends 'base.html' %}

{% block content %}

<style>

    .form-container{

        width:500px;

        margin:auto;

        background:white;

        padding:40px;

        border-radius:20px;

        box-shadow:0px 10px 30px rgba(0,0,0,0.1);

        animation:up 0.8s ease;
    }

    .form-container h1{

        margin-bottom:30px;

        color:#111827;

        text-align:center;
    }

    .form-group{

        margin-bottom:20px;
    }

    .form-group label{

        display:block;

        margin-bottom:8px;

        font-weight:600;

        color:#374151;
    }

    .form-control{

        width:100%;

        padding:14px;

        border:1px solid #d1d5db;

        border-radius:10px;

        outline:none;

        font-size:16px;

        transition:0.3s;
    }

    .form-control:focus{

        border-color:#6366f1;

        box-shadow:0px 0px 10px rgba(99,102,241,0.3);
    }

    .submit-btn{

        width:100%;

        padding:15px;

        border:none;

        border-radius:12px;

        background:linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

        color:white;

        font-size:17px;

        font-weight:600;

        cursor:pointer;

        transition:0.4s;
    }

    .submit-btn:hover{

        transform:translateY(-3px);

        box-shadow:0px 10px 20px rgba(99,102,241,0.3);
    }

</style>


<div class="form-container">

    <h1>Add Task</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Task Title</label>

            <input
                type="text"
                name="title"
                class="form-control"
                placeholder="Enter task title"
                required
            >

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="4"
                placeholder="Enter task description"
            ></textarea>

        </div>


        <div class="form-group">

            <label>Priority</label>

            <select
                name="priority"
                class="form-control"
            >

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Status</label>

            <select
                name="status"
                class="form-control"
            >

                <option value="Pending">
                    Pending
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Deadline</label>

            <input
                type="date"
                name="deadline"
                class="form-control"
            >

        </div>


        <button
            type="submit"
            class="submit-btn"
        >
            Add Task
        </button>

    </form>

</div>

{% endblock %}
