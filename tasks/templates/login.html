{% extends 'base.html' %}

{% block content %}

<style>

    .auth-container{

        width:100%;

        height:85vh;

        display:flex;

        justify-content:center;

        align-items:center;

        animation:fadeIn 0.8s ease;
    }

    .auth-box{

        width:420px;

        background:rgba(255,255,255,0.75);

        backdrop-filter:blur(15px);

        padding:40px;

        border-radius:20px;

        box-shadow:0px 10px 30px rgba(0,0,0,0.1);

        animation:up 0.8s ease;
    }

    .auth-box h2{

        text-align:center;

        margin-bottom:30px;

        color:#111827;

        font-size:35px;
    }

    .auth-box form{

        display:flex;

        flex-direction:column;

        gap:20px;
    }

    .auth-box input{

        width:100%;

        padding:15px;

        border:1px solid #d1d5db;

        border-radius:12px;

        outline:none;

        font-size:16px;

        transition:0.3s;
    }

    .auth-box input:focus{

        border-color:#6366f1;

        box-shadow:0px 0px 10px rgba(99,102,241,0.3);
    }

    .auth-box button{

        padding:15px;

        border:none;

        border-radius:12px;

        background:linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

        color:white;

        font-size:17px;

        font-weight:600;

        cursor:pointer;

        transition:0.4s;
    }

    .auth-box button:hover{

        transform:translateY(-3px);

        box-shadow:0px 10px 20px rgba(99,102,241,0.3);
    }

    .auth-link{

        text-align:center;

        margin-top:20px;

        color:#374151;
    }

    .auth-link a{

        color:#6366f1;

        text-decoration:none;

        font-weight:600;
    }

    .forgot-password{

        text-align:right;

        margin-top:-10px;
    }

    .forgot-password a{

        color:#6366f1;

        text-decoration:none;

        font-size:14px;

        font-weight:500;
    }

    .forgot-password a:hover{

        text-decoration:underline;
    }

    .message{

        background:#fee2e2;

        color:#dc2626;

        padding:12px;

        border-radius:10px;

        margin-bottom:20px;

        text-align:center;
    }

    @keyframes up{

        from{
            opacity:0;
            transform:translateY(40px);
        }

        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    @keyframes fadeIn{

        from{
            opacity:0;
        }

        to{
            opacity:1;
        }
    }

</style>


<div class="auth-container">

    <div class="auth-box">

        <h2>Login</h2>

        {% for message in messages %}

            <div class="message">

                {{ message }}

            </div>

        {% endfor %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <div class="forgot-password">

                <a href="{% url 'forgot_password' %}">

                    Forgot Password?

                </a>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <div class="auth-link">

            Don't have an account?

            <a href="{% url 'register' %}">

                Register

            </a>

        </div>

    </div>

</div>

{% endblock %}
